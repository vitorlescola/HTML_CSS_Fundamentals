<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>

    <div class="row">
        <div class="col bg-danger">1</div>
        <div class="col bg-warning">2</div>
        <div class="col bg-primary">3</div>
    </div>
    <br>

    <div class="row">
        <div class="col-3 bg-danger">1</div>
        <div class="col-1 bg-success">2</div>
        <div class="col bg-secondary">3</div>
    </div>
    <br>

    <div class="row row-cols-5">
        <div class="col bg-primary">1</div>
        <div class="col bg-success">2</div>
        <div class="col bg-danger">3</div>
        <div class="col bg-warning">4</div>
        <div class="col bg-dark text-light">5</div>
        <div class="col bg-info">6</div>
        <div class="col bg-primary">7</div>
        <div class="col bg-secondary">8</div>
        <div class="col bg-success">9</div>
        <div class="col bg-danger">10</div>
        <div class="col bg-warning">11</div>
        <div class="col bg-info">12</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
